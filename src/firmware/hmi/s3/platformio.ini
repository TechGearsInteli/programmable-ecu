; Firmware da tela (HMI) no ESP32-S3 com display de 4,3" 800x480 e touch capacitivo.
;
; Placa configurada: Sunton ESP32-8048S043C (ESP32-S3 N16R8, painel RGB 16 bits,
; touch GT911). O modelo da equipe ainda nao foi comprado: os pinos estao todos
; em src/board.h e PRECISAM ser conferidos na placa real antes de gravar.
;
; As telas (src/firmware/hmi/ui) e o nucleo (src/firmware/common) sao os mesmos
; do simulador do PC; aqui so entram o driver da placa e a UART.

[platformio]
default_envs = sunton_8048s043c

[env:sunton_8048s043c]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.2.2
    symlink://../../common
    symlink://../ui
; -I.. aponta para src/firmware/hmi, onde fica o lv_conf.h usado tambem pelo simulador.
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I..
