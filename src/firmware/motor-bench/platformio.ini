; Firmware de BANCADA do ESP do motor (ESP32 DevKit) para validar a tela S3.
;
; Potenciometros fazem o papel dos sensores, o nucleo calcula Pulse Width e
; avanco, a UART2 conversa com a S3 e a NVS guarda a calibracao.
; NAO aciona bico, bobina nem rele: isso e do firmware do motor (feature 1.5).
;
;   pio run                 compila
;   pio run -t upload       grava na placa
;   pio device monitor      ve o Serial (celula, valor e PW)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../common
build_flags =
    -Wall
